<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="900" height="520" fill="#f8f4ec" rx="18"/>
  <text x="450" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#16131f">Juno HUD States</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#09080e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g fill="#131a2d" filter="url(#shadow)">
    <rect x="28" y="66" width="190" height="74" rx="18"/>
    <rect x="244" y="66" width="190" height="74" rx="18"/>
    <rect x="466" y="66" width="190" height="74" rx="18"/>
    <rect x="682" y="66" width="190" height="74" rx="18"/>
    <rect x="28" y="170" width="190" height="74" rx="18"/>
    <rect x="244" y="170" width="190" height="74" rx="18"/>
    <rect x="466" y="170" width="190" height="74" rx="18"/>
    <rect x="682" y="170" width="190" height="74" rx="18"/>
  </g>

  <g font-size="12" font-weight="700">
    <circle cx="60" cy="103" r="15" fill="#6a8aff"/>
    <text x="60" y="108" text-anchor="middle" fill="#fff">J</text>
    <text x="86" y="99" fill="#d8ddff">Checking…</text>
    <text x="86" y="116" fill="#9aa3bb" font-size="10" font-weight="500">Readiness check</text>

    <circle cx="276" cy="103" r="15" fill="#6a8aff"/>
    <text x="276" y="108" text-anchor="middle" fill="#fff">J</text>
    <text x="302" y="95" fill="#d8ddff">Checking</text>
    <text x="302" y="111" fill="#d8ddff">microphone…</text>

    <circle cx="498" cy="103" r="15" fill="#6a8aff"/>
    <text x="498" y="108" text-anchor="middle" fill="#fff">J</text>
    <text x="524" y="95" fill="#d8ddff">Waiting for</text>
    <text x="524" y="111" fill="#d8ddff">speech…</text>

    <circle cx="714" cy="103" r="15" fill="#34c786"/>
    <text x="714" y="108" text-anchor="middle" fill="#fff">J</text>
    <text x="740" y="99" fill="#34c786">Listening</text>
    <rect x="740" y="108" width="4" height="12" rx="2" fill="#34c786"/>
    <rect x="748" y="102" width="4" height="22" rx="2" fill="#34c786"/>
    <rect x="756" y="106" width="4" height="14" rx="2" fill="#34c786"/>

    <circle cx="60" cy="207" r="15" fill="#d9852b"/>
    <text x="60" y="212" text-anchor="middle" fill="#fff">J</text>
    <text x="86" y="203" fill="#f0ad5f">Polishing…</text>
    <text x="86" y="220" fill="#9aa3bb" font-size="10" font-weight="500">Writing pass</text>

    <circle cx="276" cy="207" r="15" fill="#34c786"/>
    <text x="276" y="212" text-anchor="middle" fill="#fff">J</text>
    <text x="302" y="203" fill="#34c786">Inserted</text>
    <text x="302" y="220" fill="#9aa3bb" font-size="10" font-weight="500">Text landed</text>

    <circle cx="498" cy="207" r="15" fill="#6a8aff"/>
    <text x="498" y="212" text-anchor="middle" fill="#fff">J</text>
    <text x="524" y="203" fill="#9eb0ff">Copy Ready</text>
    <text x="524" y="220" fill="#9aa3bb" font-size="10" font-weight="500">Safe fallback</text>

    <circle cx="714" cy="207" r="15" fill="#ff4d4f"/>
    <text x="714" y="212" text-anchor="middle" fill="#fff">!</text>
    <text x="740" y="203" fill="#ff8789">Error</text>
    <text x="740" y="220" fill="#9aa3bb" font-size="10" font-weight="500">Fix and retry</text>
  </g>

  <rect x="42" y="292" width="816" height="170" rx="18" fill="#fffdf8" stroke="#e5ddcf"/>
  <text x="70" y="326" font-size="14" font-weight="700" fill="#16131f">State model</text>
  <text x="70" y="360" font-size="12" fill="#5a566a">Checking microphone → Waiting for speech → Listening is deliberate. Juno does not claim to listen before mic frames and speech energy are detected.</text>
  <text x="70" y="394" font-size="12" fill="#5a566a">Polishing means Juno is producing safer written output. There is no separate public finalizing state in the current docs model.</text>
  <text x="70" y="428" font-size="12" fill="#5a566a">Copy Ready is a success fallback when direct insertion is unsafe, ambiguous, or unavailable.</text>
  <text x="450" y="494" text-anchor="middle" font-size="11" fill="#9a9288">Juno current · refreshed 2026-05-09</text>
</svg>
