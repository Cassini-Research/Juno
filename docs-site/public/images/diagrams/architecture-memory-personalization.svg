  <text class="" x="640" y="562.4" text-anchor="middle" font-size="16" font-weight="640" fill="#667085"><tspan x="640" dy="0">Memory should be useful, inspectable, and removable. Secure or suppressed surfaces do</tspan><tspan x="640" dy="19.2">not learn.</tspan></text>
