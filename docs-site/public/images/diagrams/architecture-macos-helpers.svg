    <text class="" x="199" y="420.48" text-anchor="middle" font-size="14" font-weight="580" fill="#667085"><tspan x="199" dy="0">safe or blocked target</tspan></text>
  </g>
<g>
    <rect x="986" y="138" width="190" height="84" rx="10" fill="#ecfdf3" stroke="#b8d8ca" stroke-width="1.2"/>
