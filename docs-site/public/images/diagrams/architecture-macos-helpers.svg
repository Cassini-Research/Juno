    <text class="" x="640" y="312.24" text-anchor="middle" font-size="14" font-weight="580" fill="rgba(248,242,231,.78)"><tspan x="640" dy="0">the product surface users</tspan><tspan x="640" dy="16.8">control</tspan></text>
