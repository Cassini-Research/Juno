[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "juno-voice"
version = "0.2.0"
description = "Juno - local-first voice writing for Mac."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0.0",
    "huggingface-hub>=1.9.0",
    "silero-vad>=5.1.2",
    "webrtcvad>=2.0.10",
    "torch>=2.1",
    # Natural-language time parsing for the Actions (Notes/Reminders) pipeline.
    "dateparser>=1.2",
    # Apple Silicon local lanes (best_local profile: mlx_whisper final + mlx_lm writer).
    # Marked so Linux/CI installs stay lightweight; install on arm64 macOS only.
    "mlx-whisper>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.22.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["juno_v2*", "juno_core_v3*"]
